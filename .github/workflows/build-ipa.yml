# build-ipa.yml — WezWordn CI: ثلاث مهام منفصلة (v2)
# =====================================================================================
# البنية:
#   1) core-tests            — اختبارات WezWordnCore (Swift Package) فقط.
#   2) upstream-compat-tests — اختبارات Bitwarden الأصلية على المحاكي.
#      مهمة توافق إلزامية: فشلها يعني أن الإصدار غير معتمد نهائيًا، حتى لو
#      نجح بناء الـ IPA في المهمة الثالثة (التي تعمل مستقلة لأغراض التشخيص).
#   3) build-ipa             — أرشفة غير موقّعة + تجميع WezWordn.ipa + تحقق
#      آلي من محتوى الـ .app (Bundle ID واسم العرض والامتدادات).
#
# قواعد صارمة:
#   - لا continue-on-error في أي خطوة؛ الفشل يظهر فشلًا.
#   - سجلات xcodebuild وملفات xcresult تُرفع كـ Artifacts دائمًا (if: always).
#   - لا أسرار توقيع: الأرشفة بـ CODE_SIGNING_ALLOWED=NO، والناتج UNSIGNED
#     يحتاج إعادة توقيع عبر AltStore/SideStore أو شهادة Apple Developer.
#
# دروس runs #1–#3 الموثّقة:
#   - غياب platforms في WezWordnCore أسقط ترجمة macOS (أُصلح في Package.swift).
#   - غياب mint أسقط سكربت SwiftGen (PhaseScriptExecution) في target
#     BitwardenResources: ‏"mint: command not found" exit 65 — السكربت نفسه
#     يضيف /opt/homebrew/bin إلى PATH، فتثبيت mint عبر brew كافٍ، مع
#     mint bootstrap لتثبيت أدوات Mintfile الست مسبقًا.
#   - Resolve Package Graph كان سليمًا في كل الـ runs؛ الخطوة هنا صريحة
#     ومستقلة مع تخزين مؤقت لمجلد SourcePackages بمفتاح بصمة
#     Package.resolved (دون تغيير أي إصدار تبعية).

name: Build WezWordn IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UPSTREAM_DIR: upstream-ios
  SCHEME: Bitwarden
  WORKSPACE: upstream-ios/Bitwarden.xcworkspace

jobs:
  core-tests:
    name: Test WezWordnCore
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WezWordn
        uses: actions/checkout@v4

      - name: Run WezWordnCore tests
        run: |
          set -o pipefail
          cd WezWordnCore
          swift test 2>&1 | tee ../core-tests.log

      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: core-tests.log
          if-no-files-found: warn
          retention-days: 30

  upstream-compat-tests:
    name: Test upstream Bitwarden compatibility
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout WezWordn
        uses: actions/checkout@v4

      - name: Select Xcode per upstream .xcode-version (26.6)
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            echo "::warning::Xcode 26.6 غير موجود على هذا الـ runner؛ سيُستخدم Xcode الافتراضي."
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version

      - name: Fetch upstream bitwarden/ios (tarball)
        run: |
          curl -fL -o /tmp/bw-ios.tar.gz \
            https://codeload.github.com/bitwarden/ios/tar.gz/refs/heads/main
          gzip -t /tmp/bw-ios.tar.gz
          mkdir -p "$UPSTREAM_DIR"
          tar -xzf /tmp/bw-ios.tar.gz -C /tmp
          cp -a /tmp/ios-main/. "$UPSTREAM_DIR/"
          test -f "$UPSTREAM_DIR/project-pm.yml"

      - name: Apply WezWordn identity (Local-bwpm.xcconfig)
        run: |
          cp identity/Local-WezWordn.xcconfig.example \
             "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"
          printf '\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            >> "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"
          # مزامنة عائلات الإعدادات الثلاث (bwpm/bwa/bwth): upstream يقرأ لكل
          # عائلة ملف Local خاصًا بها. كتابة bwpm وحده تُبقي TestHarness
          # (bwth) بهوية افتراضية مختلفة، فتختلف App Groups داخل عملية
          # الاختبار الواحدة وينهار DataStore على containerURL nil
          # (فشل Run #16 في ServiceContainerTests/MigrationServiceTests).
          printf 'ORGANIZATION_IDENTIFIER = com.wezcrypt\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            > "$UPSTREAM_DIR/Configs/Local-bwth.xcconfig"
          printf 'ORGANIZATION_IDENTIFIER = com.wezcrypt\nSHARED_APP_GROUP_IDENTIFIER = group.com.wezcrypt.wezwordn.shared\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            > "$UPSTREAM_DIR/Configs/Local-bwa.xcconfig"
          cat "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"

      - name: Copy AppIntegration sources into app target
        run: |
          mkdir -p "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures"
          cp AppIntegration/*.swift "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures/"
          ls "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures/"

      - name: Link WezWordnCore package into upstream projects
        run: |
          python3 - <<'PYEOF'
          import pathlib
          common = pathlib.Path("upstream-ios/project-common.yml")
          text = common.read_text()
          anchor = "packages:\n  BitwardenSdk:"
          assert anchor in text, "packages anchor not found in project-common.yml"
          text = text.replace(anchor, "packages:\n  WezWordnCore:\n    path: ../WezWordnCore\n  BitwardenSdk:", 1)
          common.write_text(text)
          pm = pathlib.Path("upstream-ios/project-pm.yml")
          text = pm.read_text()
          i = text.index("  Bitwarden:\n    type: application")
          dep_anchor = "    dependencies:\n      - target: BitwardenShared"
          j = text.index(dep_anchor, i)
          products = ["ExtendedLoginFields", "LocalTOTP", "LocalEncryptedStorage",
                      "VaultHealth", "HIBPClient", "EmergencyRecovery", "SecureSharing", "LocalDataVault"]
          block = "    dependencies:\n" + "".join(
              f"      - package: WezWordnCore\n        product: {p}\n" for p in products)
          text = text[:j] + block + text[j + len("    dependencies:\n"):]
          pm.write_text(text)
          print("WezWordnCore linked: package declared + 7 products added to Bitwarden target")
          PYEOF

      - name: Cache Mint tools
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('upstream-ios/Mintfile') }}


      - name: Install Mint and bootstrap upstream tools (Mintfile)
        run: |
          brew install mint
          sudo ln -sf "$(command -v mint)" /usr/local/bin/mint || true
          mint --version
          cd "$UPSTREAM_DIR" && mint bootstrap
          mint run xcodegen --version

      - name: Apply WezWordn integration patches
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patches/01-settings-entry.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/02-sideload-datastore-resilience.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/03-sideload-userdefaults-resilience.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/04-sideload-entitlements.py" "$UPSTREAM_DIR"

      - name: Generate Xcode projects
        run: |
          cd "$UPSTREAM_DIR"
          mint run xcodegen --spec project-bwk.yml
          mint run xcodegen --spec project-pm.yml
          mint run xcodegen --spec project-bwa.yml
          mint run xcodegen --spec project-bwth.yml
          ls -d *.xcodeproj Bitwarden.xcworkspace

      - name: Resolve package dependencies (explicit)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" 2>&1 | tee resolve-packages.log

      # التوقيع هنا ad-hoc (-‎) عمدًا وداخل مهمة التوافق فقط: بلا أي توقيع
      # (CODE_SIGNING_ALLOWED=NO) لا تُضمّن entitlements في ثنائية المحاكي،
      # فيعود containerURL(forSecurityApplicationGroupIdentifier:) بـ nil
      # وتنهار اختبارات DataStore/ServiceContainer على force-unwrap —
      # كما حدث في Run #16/#18. التوقيع ad-hoc يضمّن الـ entitlements دون
      # أي شهادة أو سر، وCI الرسمي لـ upstream يوقّع بفريق حقيقي للسبب نفسه.
      - name: Test Bitwarden scheme (upstream unit tests on simulator)
        run: |
          set -o pipefail
          SIM_NAME="$(cat "$UPSTREAM_DIR/.test-simulator-device-name")"
          SIM_OS="$(cat "$UPSTREAM_DIR/.test-simulator-ios-version")"
          echo "Simulator: $SIM_NAME / iOS $SIM_OS"
          mkdir -p build
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}" \
            -resultBundlePath "$PWD/build/CompatTestResults.xcresult" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" 2>&1 | tee build/compat-tests.log

      - name: Upload compat test diagnostics (xcresult + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compat-diagnostics
          path: |
            build/CompatTestResults.xcresult
            build/compat-tests.log
            resolve-packages.log
          if-no-files-found: warn
          retention-days: 30

  build-ipa:
    name: Build unsigned WezWordn.ipa
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout WezWordn
        uses: actions/checkout@v4

      - name: Select Xcode per upstream .xcode-version (26.6)
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            echo "::warning::Xcode 26.6 غير موجود على هذا الـ runner؛ سيُستخدم Xcode الافتراضي."
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version

      - name: Fetch upstream bitwarden/ios (tarball)
        run: |
          curl -fL -o /tmp/bw-ios.tar.gz \
            https://codeload.github.com/bitwarden/ios/tar.gz/refs/heads/main
          gzip -t /tmp/bw-ios.tar.gz
          mkdir -p "$UPSTREAM_DIR"
          tar -xzf /tmp/bw-ios.tar.gz -C /tmp
          cp -a /tmp/ios-main/. "$UPSTREAM_DIR/"
          test -f "$UPSTREAM_DIR/project-pm.yml"

      - name: Apply WezWordn identity (Local-bwpm.xcconfig)
        run: |
          cp identity/Local-WezWordn.xcconfig.example \
             "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"
          printf '\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            >> "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"
          # مزامنة عائلات الإعدادات الثلاث (bwpm/bwa/bwth): upstream يقرأ لكل
          # عائلة ملف Local خاصًا بها. كتابة bwpm وحده تُبقي TestHarness
          # (bwth) بهوية افتراضية مختلفة، فتختلف App Groups داخل عملية
          # الاختبار الواحدة وينهار DataStore على containerURL nil
          # (فشل Run #16 في ServiceContainerTests/MigrationServiceTests).
          printf 'ORGANIZATION_IDENTIFIER = com.wezcrypt\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            > "$UPSTREAM_DIR/Configs/Local-bwth.xcconfig"
          printf 'ORGANIZATION_IDENTIFIER = com.wezcrypt\nSHARED_APP_GROUP_IDENTIFIER = group.com.wezcrypt.wezwordn.shared\nDEVELOPMENT_TEAM = UNSIGNEDCI\n' \
            > "$UPSTREAM_DIR/Configs/Local-bwa.xcconfig"
          cat "$UPSTREAM_DIR/Configs/Local-bwpm.xcconfig"

      - name: Copy AppIntegration sources into app target
        run: |
          mkdir -p "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures"
          cp AppIntegration/*.swift "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures/"
          ls "$UPSTREAM_DIR/Bitwarden/Application/WezWordnFeatures/"

      - name: Link WezWordnCore package into upstream projects
        run: |
          python3 - <<'PYEOF'
          import pathlib
          common = pathlib.Path("upstream-ios/project-common.yml")
          text = common.read_text()
          anchor = "packages:\n  BitwardenSdk:"
          assert anchor in text, "packages anchor not found in project-common.yml"
          text = text.replace(anchor, "packages:\n  WezWordnCore:\n    path: ../WezWordnCore\n  BitwardenSdk:", 1)
          common.write_text(text)
          pm = pathlib.Path("upstream-ios/project-pm.yml")
          text = pm.read_text()
          i = text.index("  Bitwarden:\n    type: application")
          dep_anchor = "    dependencies:\n      - target: BitwardenShared"
          j = text.index(dep_anchor, i)
          products = ["ExtendedLoginFields", "LocalTOTP", "LocalEncryptedStorage",
                      "VaultHealth", "HIBPClient", "EmergencyRecovery", "SecureSharing", "LocalDataVault"]
          block = "    dependencies:\n" + "".join(
              f"      - package: WezWordnCore\n        product: {p}\n" for p in products)
          text = text[:j] + block + text[j + len("    dependencies:\n"):]
          pm.write_text(text)
          print("WezWordnCore linked: package declared + 7 products added to Bitwarden target")
          PYEOF

      - name: Cache Mint tools
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('upstream-ios/Mintfile') }}


      - name: Install Mint and bootstrap upstream tools (Mintfile)
        run: |
          brew install mint
          sudo ln -sf "$(command -v mint)" /usr/local/bin/mint || true
          mint --version
          cd "$UPSTREAM_DIR" && mint bootstrap
          mint run xcodegen --version

      - name: Apply WezWordn integration patches
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patches/01-settings-entry.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/02-sideload-datastore-resilience.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/03-sideload-userdefaults-resilience.py" "$UPSTREAM_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/patches/04-sideload-entitlements.py" "$UPSTREAM_DIR"

      - name: Generate Xcode projects
        run: |
          cd "$UPSTREAM_DIR"
          mint run xcodegen --spec project-bwk.yml
          mint run xcodegen --spec project-pm.yml
          mint run xcodegen --spec project-bwa.yml
          mint run xcodegen --spec project-bwth.yml
          ls -d *.xcodeproj Bitwarden.xcworkspace

      - name: Resolve package dependencies (explicit)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" 2>&1 | tee resolve-packages.log

      - name: Archive app (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/WezWordn.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build-archive.log

      - name: Assemble unsigned .ipa from archived .app
        run: |
          APP_PATH="$(find build/WezWordn.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "App bundle: $APP_PATH"
          rm -rf Payload WezWordn.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry WezWordn.ipa Payload
          unzip -l WezWordn.ipa | head -n 30

      - name: Verify app bundle identity and contents
        run: |
          APP_PATH="$(find build/WezWordn.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          PLIST="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "Bundle ID:    $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          echo "Version:      $VERSION"
          echo "Extensions:"; ls "$APP_PATH/PlugIns"
          echo "Frameworks:"; ls "$APP_PATH/Frameworks"
          test "$BUNDLE_ID" = "com.wezcrypt.wezwordn" || { echo "::error::Bundle ID mismatch: $BUNDLE_ID"; exit 1; }
          test "$DISPLAY_NAME" = "WezWordn" || { echo "::error::Display name mismatch: $DISPLAY_NAME"; exit 1; }
          ls "$APP_PATH/PlugIns" | grep -qi autofill || { echo "::error::AutoFill extension missing"; exit 1; }
          file "$APP_PATH"/* | grep -i 'Mach-O' | head -n 3 || true

      - name: Checksums
        run: |
          shasum -a 256 WezWordn.ipa | tee SHA256SUMS.txt

      - name: Upload artifacts (unsigned IPA + archive log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WezWordn-unsigned
          path: |
            WezWordn.ipa
            SHA256SUMS.txt
            build-archive.log
            resolve-packages.log
          if-no-files-found: error
          retention-days: 30
